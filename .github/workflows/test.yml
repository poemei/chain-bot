name: Chain Bot Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chain Bot
        uses: actions/checkout@v4
        with:
          path: chain-bot

      - name: Checkout STN-LABZ ABI
        uses: actions/checkout@v4
        with:
          repository: stnlabz/ABI
          path: ABI

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev

      - name: Build and run every test
        working-directory: chain-bot
        run: make clean test
